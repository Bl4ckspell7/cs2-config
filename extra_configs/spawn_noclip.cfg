// spawn_noclip.cfg  (stateless version - no tracking needed)
// Keep  bind "y" "noclip";  in cs2_config.cfg (plain toggle).
//
// s1..s10: respawn yourself (this clears noclip, whatever state you were in), then MatchZy .spawn N.
//   css_respawn @me  = CS2-SimpleAdmin, needs @css/cheats (same permission as css_noclip @me)
//   css_spawn N      = MatchZy .spawn N (console form)
// If N is higher than the map's spawn count, MatchZy ignores it and you are only respawned at a random spawn.
// A respawn resets health and gives you a fresh loadout.
alias "s1" "css_respawn @me; css_spawn 1"
alias "s2" "css_respawn @me; css_spawn 2"
alias "s3" "css_respawn @me; css_spawn 3"
alias "s4" "css_respawn @me; css_spawn 4"
alias "s5" "css_respawn @me; css_spawn 5"
alias "s6" "css_respawn @me; css_spawn 6"
alias "s7" "css_respawn @me; css_spawn 7"
alias "s8" "css_respawn @me; css_spawn 8"
alias "s9" "css_respawn @me; css_spawn 9"
alias "s10" "css_respawn @me; css_spawn 10"